<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Arka plan -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f35"/>
      <stop offset="100%" style="stop-color:#0d0f1a"/>
    </linearGradient>
    <linearGradient id="fanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f9cf9"/>
      <stop offset="100%" style="stop-color:#9d7df0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dış çember -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#4f9cf9" stroke-width="1.5" opacity="0.8"/>

  <!-- Fan kanatları (merkezi fan simgesi) -->
  <g transform="translate(32,32)" filter="url(#glow)">
    <!-- Merkez daire -->
    <circle r="5" fill="url(#fanGrad)"/>

    <!-- Kanat 1 (sağ üst) -->
    <path d="M3,-3 Q12,-14 6,-18 Q0,-22 -4,-16 Q-2,-8 3,-3 Z"
          fill="url(#fanGrad)" opacity="0.9"/>
    <!-- Kanat 2 (sol alt) -->
    <path d="M-3,3 Q-12,14 -6,18 Q0,22 4,16 Q2,8 -3,3 Z"
          fill="url(#fanGrad)" opacity="0.9"/>
    <!-- Kanat 3 (sol üst) -->
    <path d="M-3,-3 Q-14,-12 -18,-6 Q-22,0 -16,4 Q-8,2 -3,-3 Z"
          fill="url(#fanGrad)" opacity="0.7"/>
    <!-- Kanat 4 (sağ alt) -->
    <path d="M3,3 Q14,12 18,6 Q22,0 16,-4 Q8,-2 3,3 Z"
          fill="url(#fanGrad)" opacity="0.7"/>
  </g>

  <!-- RGB klavye temsili (alt şerit) -->
  <rect x="14" y="48" width="36" height="4" rx="2"
        fill="none" stroke="#4f9cf9" stroke-width="1" opacity="0.6"/>
  <rect x="14" y="48" width="10" height="4" rx="1" fill="#ff4757" opacity="0.7"/>
  <rect x="25" y="48" width="14" height="4" rx="1" fill="#4f9cf9" opacity="0.7"/>
  <rect x="40" y="48" width="10" height="4" rx="1" fill="#9d7df0" opacity="0.7"/>
</svg>
